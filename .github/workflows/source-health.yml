name: Source Health

# Hits every upstream scholarly API end-to-end so drift (a dead endpoint, a
# schema change, a new auth wall) is caught here instead of by users. The
# hermetic unit suite cannot detect this because it mocks the network.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: npm ci
      - name: Live source health check
        run: npm run test:live
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          S2_KEY: ${{ secrets.S2_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
